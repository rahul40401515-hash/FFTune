name: Build FFTune

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fftune-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  build:
    name: Check model and build unsigned iOS app
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Run preset model checks
        run: |
          xcrun swiftc -swift-version 5 Sources/Model.swift Tests/PresetModelChecks.swift \
            -o "$RUNNER_TEMP/fftune-model-checks"
          "$RUNNER_TEMP/fftune-model-checks"

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project FFTune.xcodeproj \
            -scheme FFTune \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/FFTuneDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/FFTune-Build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned app
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/FFTuneDerivedData/Build/Products/Release-iphoneos/FFTune.app" \
            "$RUNNER_TEMP/FFTune-unsigned-ios-app.zip"

      - name: Upload unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FFTune-unsigned-ios-app
          path: ${{ runner.temp }}/FFTune-unsigned-ios-app.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Xcode build result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FFTune-build-result
          path: ${{ runner.temp }}/FFTune-Build.xcresult
          if-no-files-found: ignore
          retention-days: 7
